<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rohit Kumawat</title>
<meta name="description" content="Rohit Kumawat: product designer and product manager in Delhi.">
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{const t=localStorage.getItem("rk-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
@font-face{font-family:"TikTok Sans";src:url("fonts/tiktok-sans.woff2") format("woff2");font-weight:300 900;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/plex-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/plex-mono-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Reenie Beanie";src:url("fonts/reenie-beanie.woff2") format("woff2");font-weight:400;font-display:swap}

/* Tokens: neutral palette, light first */
:root{
  --bg:#ffffff;--fg:#0a0a0a;--card:#ffffff;--secondary:#f5f5f5;--muted:#f5f5f5;--muted-fg:#737373;
  --border:#e5e5e5;--border-strong:#a1a1a1;--primary:#171717;--primary-fg:#fafafa;--brand:#adfa1d;
  --rule:rgba(10,10,10,.06);--dot:rgba(10,10,10,.22);
  --glass-bg:rgba(255,255,255,.84);--glass-line:rgba(10,10,10,.08);
  --glass-shadow:0 1px 1px rgba(0,0,0,.03),0 8px 28px -10px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.7);
  --note:#fff3a8;--note-ink:#23201a;
  --sans:"TikTok Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:"Reenie Beanie","Segoe Print","Bradley Hand",cursive;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.32,.64,1);
  --spring-soft:cubic-bezier(.3,1.18,.5,1);
  --frame:min(1200px, calc(100% - 32px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a0a;--fg:#fafafa;--card:#171717;--secondary:#262626;--muted:#262626;--muted-fg:#a1a1a1;
    --border:rgba(255,255,255,.1);--border-strong:#525252;--primary:#e5e5e5;--primary-fg:#171717;
    --rule:rgba(250,250,250,.07);--dot:rgba(250,250,250,.28);
    --glass-bg:rgba(23,23,23,.82);--glass-line:rgba(255,255,255,.1);
    --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    --note:#efe08a;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--fg:#fafafa;--card:#171717;--secondary:#262626;--muted:#262626;--muted-fg:#a1a1a1;
  --border:rgba(255,255,255,.1);--border-strong:#525252;--primary:#e5e5e5;--primary-fg:#171717;
  --rule:rgba(250,250,250,.07);--dot:rgba(250,250,250,.28);
  --glass-bg:rgba(23,23,23,.82);--glass-line:rgba(255,255,255,.1);
  --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  --note:#efe08a;
}
@media (min-width:900px){:root{--frame:min(1200px, calc(100% - 176px))}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01";overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:10px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
::selection{background:var(--brand);color:#0a0a0a}
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.press{transition:transform .35s var(--spring)}
.press:active{transform:scale(.95)}
.hap{position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none}

/* Loader: hairline keyboard + progress line */
.loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:transform .5s cubic-bezier(.76,0,.24,1)}
.loader.done{transform:translateY(-100%)}
.loader canvas{position:absolute;inset:0;width:100%;height:100%}
.loader .lp{position:absolute;left:50%;bottom:clamp(48px,12vh,120px);transform:translateX(-50%);display:grid;justify-items:center;gap:12px}
.loader .bar{width:160px;height:1px;background:var(--border);overflow:hidden}
.loader .bar i{display:block;height:100%;background:var(--fg);transform-origin:left;transform:scaleX(0)}
.loader .lt{font:500 12px var(--mono);color:var(--muted-fg);font-variant-numeric:tabular-nums}

/* Progressive blur at the screen edges */
.pblur{display:none}
.pblur.top{top:0;height:96px}
.pblur.bot{bottom:0;height:64px}
.pblur i{position:absolute;inset:0}
.pblur.top i{-webkit-mask-image:linear-gradient(to top,transparent var(--a),#000 var(--b),#000 var(--c),transparent var(--d));mask-image:linear-gradient(to top,transparent var(--a),#000 var(--b),#000 var(--c),transparent var(--d))}
.pblur.bot i{-webkit-mask-image:linear-gradient(to bottom,transparent var(--a),#000 var(--b),#000 var(--c),transparent var(--d));mask-image:linear-gradient(to bottom,transparent var(--a),#000 var(--b),#000 var(--c),transparent var(--d))}
.pblur::after{content:"";position:absolute;inset:0}
.pblur.top::after{background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 70%,transparent),transparent)}
.pblur.bot::after{background:linear-gradient(to top,color-mix(in srgb,var(--bg) 55%,transparent),transparent)}

/* Rays from the theme button (always on, behind everything) */
#beams{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body{isolation:isolate}

/* Header */
.site{position:fixed;top:24px;left:0;right:0;z-index:60;pointer-events:none}
.site .row{width:var(--frame);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.site .row>*{pointer-events:auto}
.logo{height:52px;padding:0 18px 0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.logo b{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font:500 13px var(--mono)}
.logo .lbl{transition:max-width .5s var(--ease-out),opacity .3s;max-width:140px;overflow:hidden;white-space:nowrap}
.nav{position:relative;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.nav-ind{position:absolute;top:4px;left:0;height:44px;border-radius:999px;background:var(--secondary);box-shadow:inset 0 0 0 1px var(--glass-line);transition:transform .5s var(--spring),width .5s var(--spring),opacity .3s;pointer-events:none}
.nav-ind.off{opacity:0}
.ni{position:relative;z-index:1;height:44px;min-width:44px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;color:var(--muted-fg);white-space:nowrap;transition:color .25s,padding .5s var(--ease-out),gap .5s var(--ease-out)}
.ni:hover,.ni[aria-current="page"]{color:var(--fg)}
.ni svg{width:18px;height:18px;flex:none}
.ni .lbl{display:inline-block;max-width:120px;overflow:hidden;transition:max-width .5s var(--ease-out),opacity .3s,margin .5s var(--ease-out)}
.ni .chev{width:14px;height:14px;margin-left:-2px;transition:transform .35s var(--spring),opacity .3s,width .5s var(--ease-out),margin .5s var(--ease-out)}
.ni[aria-expanded="true"] .chev{transform:rotate(180deg)}
.site.condensed .ni .lbl{max-width:0;opacity:0}
.site.condensed .ni .chev{width:0;opacity:0;margin-left:0}
.site.condensed .ni{padding:0 13px;gap:0}
.site.condensed .logo .lbl{max-width:0;opacity:0}
.site.condensed .logo{padding-right:8px;gap:0}
.dd-wrap{position:relative}
.dd{position:absolute;top:calc(100% + 12px);left:50%;width:320px;padding:8px;border-radius:22px;transform:translateX(-50%) translateY(-6px) scale(.96);transform-origin:top center;opacity:0;visibility:hidden;transition:transform .45s var(--spring),opacity .2s,visibility 0s .45s}
.dd.open{transform:translateX(-50%) translateY(0) scale(1);opacity:1;visibility:visible;transition:transform .45s var(--spring),opacity .2s,visibility 0s}
.dd a{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:8px;border-radius:14px;transition:background .2s}
.dd a:hover,.dd a:focus-visible{background:var(--secondary)}
.dd .th{width:40px;height:40px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font:500 11px var(--mono);color:#fff}
.dd .nm{font-size:14px;font-weight:500;line-height:1.2}
.dd .nm small{display:block;font-size:12px;color:var(--muted-fg);font-weight:400}
.dd .cd{font:11px var(--mono);color:var(--muted-fg)}
.dd .all{grid-template-columns:1fr auto;border-top:1px solid var(--border);border-radius:0 0 14px 14px;margin-top:4px;padding:12px 8px 8px;font-size:13px;color:var(--muted-fg)}
.right{display:flex;align-items:center;gap:10px}
.call{position:relative;height:52px;padding:0 6px 0 20px;border-radius:999px;background:var(--primary);color:var(--primary-fg);display:inline-flex;align-items:center;gap:12px;font-size:15px;font-weight:500;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);transition:transform .35s var(--spring)}
.call:hover{transform:scale(1.02)}
.call:active{transform:scale(.95)}
.call .ic{position:relative;height:40px;min-width:40px;padding:0 11px;border-radius:999px;background:var(--secondary);color:var(--fg);display:flex;align-items:center;justify-content:flex-end;gap:6px;overflow:hidden;transition:padding .45s var(--spring)}
.call .ic svg{width:18px;height:18px;flex:none}
.call .trail{display:flex;gap:6px;max-width:0;overflow:hidden;transition:max-width .5s var(--spring)}
.call .trail svg{opacity:var(--o);transform:translateX(8px);transition:transform .45s var(--spring) var(--dl),opacity .3s}
.call:hover .trail,.call:focus-visible .trail{max-width:120px}
.call:hover .trail svg,.call:focus-visible .trail svg{transform:none}
.call .cur{position:relative;width:18px;height:18px}
.call .cur svg{position:absolute;inset:0;transition:transform .5s var(--spring),opacity .3s,filter .3s}
.call .cur svg:not(.on){opacity:0;transform:translateY(10px) scale(.6);filter:blur(3px)}
.call .cur svg.was{transform:translateY(-10px) scale(.6)}
.call[aria-current="page"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.tbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .35s var(--spring)}
.tbtn:active{transform:scale(.92)}
.tbtn svg{position:absolute;width:20px;height:20px;transition:transform .55s var(--spring),opacity .3s}
.tbtn .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .tbtn .sun{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme="dark"] .tbtn .moon{opacity:1;transform:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tbtn .sun{opacity:0;transform:rotate(90deg) scale(.4)}
  :root:not([data-theme="light"]) .tbtn .moon{opacity:1;transform:none}
}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
@media (max-width:760px){
  .site{top:calc(12px + env(safe-area-inset-top,0px))}
  .logo{display:none}
  .site .row{justify-content:center;gap:6px}
  .ni{padding:0 11px;height:42px}
  .nav-ind{height:42px}
  .ni .lbl,.ni .chev{display:none}
  .call{padding:0 5px;gap:0;height:52px}
  .call .t{display:none}
  .call .ic{background:transparent;color:var(--primary-fg)}
  .call .trail{display:none}
  .dd{display:none}
}
@media (max-width:370px){.ni{padding:0 9px}.tbtn,.call{width:48px;height:48px}.call .ic{min-width:38px;height:38px;padding:0 10px}}

/* Section rail */
.rail{position:fixed;left:24px;top:50%;z-index:30;transform:translateY(-50%);display:none;flex-direction:column}
@media (min-width:900px){.rail{display:flex}}
.rail button{position:relative;height:24px;width:56px;display:flex;align-items:center}
.rail i{display:block;width:48px;height:2px;border-radius:2px;background:var(--fg);transform-origin:left center;transform:scaleX(var(--s,.25));opacity:var(--o,.3);will-change:transform}
.rail .pl{position:absolute;left:58px;top:50%;transform:translate(-6px,-50%) scale(.94);transform-origin:left center;padding:5px 10px;border-radius:999px;font:500 12px var(--mono);white-space:nowrap;opacity:0;pointer-events:none;transition:transform .35s var(--spring),opacity .2s}
.rail button:hover .pl,.rail button:focus-visible .pl{opacity:1;transform:translate(0,-50%) scale(1)}

/* Frame + rules */
.frame{width:var(--frame);margin:0 auto;position:relative}
.hr{display:none}
.hr::before,.hr::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--dot)}
.hr::before{left:126px}
.hr::after{right:126px}
@media (max-width:899px){.hr{width:100%}.hr::before{left:calc((100% - var(--frame))/2 - 2px)}.hr::after{right:calc((100% - var(--frame))/2 - 2px)}}
.sec{padding:clamp(56px,8vw,96px) clamp(16px,4vw,48px)}
.kick{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--muted-fg);text-transform:uppercase;letter-spacing:.04em}
.kick b{color:var(--fg);font-weight:500}
.h2{font-size:clamp(28px,3.6vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:560;margin:14px 0 0;max-width:22ch;text-wrap:balance}
.h2 em{font-style:normal;color:var(--muted-fg)}
.lead{color:var(--muted-fg);font-size:17px;max-width:52ch;margin:14px 0 0}
.shead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,44px)}

/* Pages */
main{position:relative;z-index:1}
.page[hidden]{display:none!important}
#app,.frame:has(> #contact){transition:opacity .55s var(--ease-out),transform .7s var(--ease-out)}
body.leaving #app,body.leaving .frame:has(> #contact){opacity:0;transform:translateY(-10px);transition:opacity .22s ease-in,transform .24s ease-in}
#app.arriving,.frame.arriving{opacity:0;transform:translateY(18px);transition:none}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ptop{padding-top:clamp(120px,16vw,170px)}

/* Buttons */
.btn{height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;background:var(--secondary);color:var(--fg);border:1px solid var(--border);transition:transform .35s var(--spring),background .2s}
.btn:hover{background:color-mix(in srgb,var(--secondary) 70%,var(--border))}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.btn svg{width:16px;height:16px}

/* Metallic link */
.metal{position:relative;isolation:isolate;height:52px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--primary-fg);overflow:hidden;transition:transform .45s var(--spring)}
.metal:hover{transform:scale(1.02)}
.metal:active{transform:scale(.93)}
.metal .rim{position:absolute;inset:0;z-index:-2;border-radius:inherit;background:linear-gradient(105deg,#3a3a3a 0%,#f5f5f5 18%,#6b6b6b 34%,#d9d9d9 50%,#4a4a4a 66%,#fafafa 82%,#3a3a3a 100%);background-size:220% 100%;animation:rim 8s ease-in-out infinite}
.metal .core{position:absolute;inset:1.5px;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 88%,#fff),var(--primary))}
.metal .sheen{position:absolute;inset:0;z-index:0;border-radius:inherit;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:300% 100%;background-position:-100% 0;pointer-events:none;mix-blend-mode:overlay}
.metal:hover .sheen{background-position:310% 0;transition:background-position 2.4s var(--ease-out)}
.metal svg{width:16px;height:16px;transition:transform .45s var(--spring)}
.metal:hover svg{transform:translate(2px,-2px)}
@keyframes rim{0%,100%{background-position:0% 0}50%{background-position:13% 0}}

/* Hero */
.hero{position:relative;min-height:min(100svh,880px);display:grid;align-items:end;padding:150px clamp(16px,4vw,48px) 56px;cursor:default}
.wx{position:absolute;z-index:0;left:50%;top:0;bottom:0;width:100vw;transform:translateX(-50%);pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 6px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 6px),transparent)}
.wx canvas{width:100%;height:100%;display:block}
.wxl{position:absolute;left:clamp(16px,4vw,48px);top:118px;display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--muted-fg);text-transform:uppercase;letter-spacing:.04em}
.wxl i{display:flex;gap:4px}
.wxl i b{width:5px;height:5px;border-radius:50%;background:var(--border-strong);opacity:.4;transition:opacity .3s,transform .4s var(--spring)}
.wxl i b.on{opacity:1;transform:scale(1.3);background:var(--fg)}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);align-items:end;gap:clamp(16px,3vw,40px)}
.htitle{margin:0;font-size:clamp(46px,6.6vw,92px);line-height:.94;letter-spacing:-.05em;font-weight:620;position:relative;cursor:default}
.htitle .sz{visibility:hidden;display:grid}
.htitle .sz>span{grid-area:1/1}
.htitle .lv{position:absolute;inset:0}
.htitle .ln{display:block;white-space:nowrap}
.htitle .ch{display:inline-block;white-space:pre}
.htitle .ch.in{animation:vin .9s var(--ease-out) both}
.htitle .ch.out{animation:vout .9s var(--ease-out) both}
@keyframes vin{from{opacity:0;filter:blur(14px);transform:translate(var(--dx),.35em) scale(1.15)}to{opacity:1;filter:none;transform:none}}
@keyframes vout{to{opacity:0;filter:blur(14px);transform:translate(var(--dx),-.45em) scale(1.1)}}
.hbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.about-b{position:relative;overflow:hidden;isolation:isolate;height:52px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:500;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .35s var(--spring)}
.about-b.holding{transform:scale(.97)}
.about-b .liq{position:absolute;inset:0;z-index:-1;transform:translateY(115%);color:var(--brand)}
.about-b .liq::after{content:"";position:absolute;left:0;right:0;top:10px;bottom:0;background:currentColor}
.about-b .liq svg{position:absolute;left:0;top:0;width:200%;height:12px;animation:wave 1.6s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.about-b .lbl{display:grid}
.about-b .lbl span{grid-area:1/1;transition:transform .35s var(--spring),opacity .2s}
.about-b .lbl .k{opacity:0;transform:translateY(100%)}
.about-b.holding .lbl .a{opacity:0;transform:translateY(-100%)}
.about-b.holding .lbl .k{opacity:1;transform:none;color:#0a0a0a}
.pwrap{position:relative;align-self:end;justify-self:center;width:100%;max-width:360px;--look:0;--lookY:0;perspective:900px}
.pwrap img{width:100%;height:auto;transform-origin:50% 90%;will-change:transform;user-select:none;-webkit-user-drag:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pwrap img{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 -1.5px 0 #fff)}}
:root[data-theme="dark"] .pwrap img{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 -1.5px 0 #fff)}
.acc{display:grid;gap:4px;align-self:end}
.acc button{width:100%;display:block;cursor:default;align-items:center;gap:12px;padding:14px 0;text-align:left;font-size:clamp(17px,1.6vw,21px);font-weight:540;letter-spacing:-.025em;color:var(--muted-fg);transition:color .45s var(--ease-out),transform .6s var(--ease-out)}
.acc .on button{transform:translateX(4px)}
.acc .on button,.acc button:hover{color:var(--fg)}
.acc button .pm{position:relative;width:12px;height:12px;flex:none}
.acc button .pm::before,.acc button .pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:currentColor;transition:transform .35s var(--spring)}
.acc button .pm::after{transform:rotate(90deg)}

/* Handwritten note from holding About me */
